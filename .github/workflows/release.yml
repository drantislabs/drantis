name: release-v1

on:
  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: stable verification / node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/assert-release-version.mjs 1.0.0
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Build web and CLI
        run: |
          npm run build:web
          npm run build:cli
      - name: Controlled release evidence
        run: |
          npm run cli -- analyze scenarios/production-reference --json /tmp/reference.json
          npm run cli -- analyze scenarios/missing-tenant-authorization --json /tmp/regression.json
          npm run cli -- analyze scenarios/senten-reference --json /tmp/senten.json
          npm run verify:scenarios -- /tmp/reference.json /tmp/regression.json /tmp/senten.json
      - name: Scanner adapter evidence
        run: |
          npm run cli -- analyze scenarios/production-reference \
            --scanner semgrep-json:tests/fixtures/scanners/semgrep.json \
            --scanner gitleaks-json:tests/fixtures/scanners/gitleaks.json \
            --scanner osv-json:tests/fixtures/scanners/osv.json \
            --scanner trivy-json:tests/fixtures/scanners/trivy.json \
            --json /tmp/scanners.json
          npm run verify:scanners -- /tmp/scanners.json

  release-surfaces:
    name: stable release surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/assert-release-version.mjs 1.0.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose config --quiet
      - name: Build self-hosted image
        run: docker build -t drantis:1.0.0 .
      - name: Exercise isolated runner
        run: |
          docker build -f tests/fixtures/runner/Dockerfile -t drantis-runner:release tests/fixtures/runner
          RUNNER_IMAGE="$(docker image inspect drantis-runner:release --format '{{.Id}}')"
          npm run verify:isolated-runner -- "$RUNNER_IMAGE"

  desktop-windows:
    name: stable desktop / windows
    runs-on: windows-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: node scripts/assert-release-version.mjs 1.0.0
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: drantis-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*
            apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  publish:
    name: publish GitHub + GHCR
    runs-on: ubuntu-latest
    needs: [verify, release-surfaces, desktop-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/assert-release-version.mjs 1.0.0
      - name: Build CLI package
        run: |
          mkdir -p release-artifacts
          npm run build:cli
          npm pack -w @launchproof/cli --pack-destination release-artifacts
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > release-artifacts/drantis-1.0.0-sbom.cdx.json
      - name: Generate self-analysis
        run: npm run cli -- analyze . --json release-artifacts/drantis-1.0.0-self-analysis.json
      - uses: actions/download-artifact@v4
        with:
          name: drantis-windows
          path: release-artifacts/windows
      - name: Checksums
        shell: bash
        run: |
          find release-artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release-artifacts/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-artifacts/**/*'
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish container
        run: |
          docker build \
            -t ghcr.io/drantislabs/drantis:1.0.0 \
            -t ghcr.io/drantislabs/drantis:latest .
          docker push ghcr.io/drantislabs/drantis:1.0.0
          docker push ghcr.io/drantislabs/drantis:latest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            --verify-tag \
            --title "Drantis 1.0.0" \
            --notes-file docs/v1-release-notes.md \
            release-artifacts/**
