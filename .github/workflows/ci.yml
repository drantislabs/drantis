name: ci

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run release surfaces, Node 26, Docker, Playwright, and Windows desktop'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: drantis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-node24:
    name: verify / node-24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependency lock required
        run: test -f package-lock.json || { echo 'package-lock.json is required for reproducible CI'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @launchproof/web
      - run: npm run build -w @launchproof/cli
      - run: npm pack -w @launchproof/cli --dry-run
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Controlled release scenarios
        run: |
          npm run cli -- analyze scenarios/production-reference --json /tmp/drantis-reference.json
          npm run cli -- analyze scenarios/missing-tenant-authorization --json /tmp/drantis-regression.json
          npm run cli -- analyze scenarios/senten-reference --json /tmp/drantis-senten.json
          npm run verify:scenarios -- /tmp/drantis-reference.json /tmp/drantis-regression.json /tmp/drantis-senten.json

  verify-node26:
    name: verify / node-26
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @launchproof/web
      - run: npm run build -w @launchproof/cli

  release-surfaces:
    name: release surfaces / node-24
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-node24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Docker Compose validation
        run: docker compose config --quiet
      - name: Docker build
        run: docker build -t drantis-ci .
      - name: Isolated runner image
        run: docker build -f tests/fixtures/runner/Dockerfile -t drantis-runner:ci tests/fixtures/runner
      - name: Authorized isolated-runner exercise
        run: |
          RUNNER_IMAGE="$(docker image inspect drantis-runner:ci --format '{{.Id}}')"
          npm run verify:isolated-runner -- "$RUNNER_IMAGE"

  windows-desktop:
    name: windows desktop / node-24
    if: ${{ inputs.full }}
    runs-on: windows-latest
    timeout-minutes: 35
    needs: verify-node24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Tauri desktop build
        run: npm run build -w @launchproof/desktop
